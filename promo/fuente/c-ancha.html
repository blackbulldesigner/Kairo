<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body { width: 1920px; height: 1080px; }
  .fondo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .velo { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(13,16,21,0.95) 0%, rgba(13,16,21,0.82) 32%, rgba(13,16,21,0.2) 62%, rgba(13,16,21,0.1) 100%), linear-gradient(0deg, rgba(13,16,21,0.6), rgba(13,16,21,0) 35%); }
  .borroso { left: 0; top: 0; width: 470px; height: 130px; }
  .aviso { position: absolute; right: 64px; top: 64px; width: 620px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  .texto { position: absolute; left: 120px; top: 0; bottom: 0; width: 900px; display: flex; flex-direction: column; justify-content: center; }
  .grande { font-size: 200px; font-weight: 700; letter-spacing: -8px; line-height: 0.92; }
  .bajada { font-size: 40px; margin-top: 34px; color: #C8D2DF; line-height: 1.3; }
  .abajo { position: absolute; left: 120px; right: 120px; bottom: 70px; display: flex; align-items: center; justify-content: space-between; }
  .marca img { width: 56px; height: 56px; }
  .marca b { font-size: 34px; }
</style></head>
<body>
  <img class="fondo" src="../recursos/cuadro-5.png">
  <div class="borroso"></div>
  <div class="velo"></div>
  <img class="aviso" src="../recursos/aviso.png">
  <div class="texto">
    <div class="grande">F9<br><span class="acento">y listo.</span></div>
    <p class="bajada">Tu jugada ya está guardada. Y ni lo notaste mientras jugabas.</p>
  </div>
  <div class="abajo">
    <div class="marca"><img src="../recursos/logo.png"><b>Kairo</b><span class="version">1.0</span></div>
    <span style="font-size:28px"><span class="verde">Gratis para Windows</span> · <span class="enlace">github.com/blackbulldesigner/Kairo</span></span>
  </div>
</body></html>
