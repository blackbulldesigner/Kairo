<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body { width: 1080px; height: 1080px; }
  .fondo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% 50%; }
  .velo { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(13,16,21,0.15) 0%, rgba(13,16,21,0.25) 40%, rgba(13,16,21,0.92) 78%, #0D1015 100%), linear-gradient(90deg, rgba(25,40,61,0.45), rgba(25,40,61,0)); }
  .aviso { position: absolute; right: 56px; top: 56px; width: 560px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  .texto { position: absolute; left: 86px; right: 86px; bottom: 70px; }
  .grande { font-size: 168px; font-weight: 700; letter-spacing: -6px; line-height: 0.95; }
  .bajada { font-size: 36px; margin-top: 26px; color: #C8D2DF; line-height: 1.3; }
  .pie { margin-top: 54px; }
  .marca img { width: 52px; height: 52px; }
  .marca b { font-size: 32px; }
</style></head>
<body>
  <img class="fondo" src="../recursos/cuadro-5.png">
  <div class="velo"></div>
  <img class="aviso" src="../recursos/aviso.png">
  <div class="texto">
    <div class="grande">F9<br><span class="acento">y listo.</span></div>
    <p class="bajada">Tu jugada ya está guardada. Y ni lo notaste mientras jugabas.</p>
    <div class="pie">
      <div class="marca"><img src="../recursos/logo.png"><b>Kairo</b><span class="version">1.0</span></div>
      <span class="verde" style="font-size:26px">Gratis para Windows</span>
    </div>
  </div>
</body></html>
